name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests import the plugin, so they need PyGObject with GTK 4, cairo and
      # gtk4-layer-shell (the system Python's, from apt) and Vyom on the path.
      - name: PyGObject, GTK 4 and Vyom
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-gtk4layershell-1.0
          git clone --depth 1 https://github.com/Theyashsawarkar/vyom /tmp/vyom
      - name: Compile
        run: python3 -m compileall -q tarang
      - name: Unit tests
        run: PYTHONPATH=/tmp/vyom python3 -m unittest discover -s tests
      - name: plugin.toml
        run: |
          python3 - <<'EOF'
          import tomllib
          m = tomllib.load(open("plugin.toml", "rb"))
          for key in ("name", "title", "version", "vyom", "icon", "color", "description"):
              assert m.get(key), f"plugin.toml: missing {key}"
          assert m["name"] == "tarang", m["name"]
          assert f"## v{m['version']} " in open("CHANGELOG.md").read(), "CHANGELOG.md: no entry for this version"
          EOF
      - name: Every key is documented
        run: |
          python3 - <<'EOF'
          import pathlib, re
          readme = pathlib.Path("README.md").read_text()
          missing = []
          for path in pathlib.Path("tarang").rglob("*.py"):
              for line in path.read_text().splitlines():
                  m = re.match(r"#\s*keybind:\s*Vyom/[^|]+\|\s*([^|]+?)\s*\|", line)
                  if m and f"`{m.group(1)}`" not in readme:
                      missing.append(m.group(1))
          assert not missing, f"keys missing from README.md: {missing}"
          EOF
      - name: Keys match the keymap
        run: |
          VYOM_CORE=/tmp/vyom python3 scripts/keybinds.py --check
      - name: Website is up to date
        run: python3 scripts/build-site.py --check
